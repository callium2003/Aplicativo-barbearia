name: Lote 0 migration reconciliation verifier

on:
  push:
    branches:
      - chore/reconcile-supabase-migrations-2026-08-07

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/reconcile-supabase-migrations-2026-08-07

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Update stale migration references in tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/rendered-html.test.mjs')
          text = path.read_text()
          replacements = {
              '20260804013607_optimize_booking_intervals_10min.sql': '20260804013607_20260803230000_optimize_booking_intervals_10min.sql',
              '20260804020000_add_team_invitations.sql': '20260804043338_add_team_invitations.sql',
              '20260804060000_isolate_professional_commission.sql': '20260806040831_20260804060000_isolate_professional_commission.sql',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected stale reference: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs
          git commit -m "test: align migration references with remote versions"
          git push origin HEAD:chore/reconcile-supabase-migrations-2026-08-07

      - name: Clean install
        shell: bash
        run: npm ci 2>&1 | tee /tmp/lote0-install.log

      - name: Typecheck
        shell: bash
        run: npm run typecheck 2>&1 | tee /tmp/lote0-typecheck.log

      - name: Tests
        shell: bash
        run: npm test 2>&1 | tee /tmp/lote0-tests.log

      - name: Lint
        shell: bash
        run: npm run lint 2>&1 | tee /tmp/lote0-lint.log

      - name: Build
        shell: bash
        run: npm run build 2>&1 | tee /tmp/lote0-build.log

      - name: Verify canonical migration count and versions
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee /tmp/lote0-lineage.log
          const fs = require('fs');
          const expected = [
            '20260801001539','20260803044908','20260803045033','20260803071307','20260803195045',
            '20260803222030','20260803224530','20260804013607','20260804043338','20260806040824',
            '20260806040831','20260806040839','20260806051055','20260807015209','20260807015637',
            '20260807020013','20260807020457','20260807022443','20260807022720','20260807025705',
            '20260807030613'
          ];
          const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql')).sort();
          const versions = files.map(f => f.slice(0, 14));
          console.log(JSON.stringify({ files, versions }, null, 2));
          if (JSON.stringify(versions) !== JSON.stringify(expected)) {
            console.error('Canonical migration lineage mismatch');
            process.exit(1);
          }
          NODE

      - name: Record successful verification
        if: success()
        shell: bash
        run: |
          rm -f docs/LOTE0-CI-FAILURE.md
          cat > docs/LOTE0-VERIFIED.md <<'EOF'
          # Lote 0 — verificação automatizada

          A reconciliação do histórico de migrations foi validada em ambiente limpo.

          Passaram com sucesso:

          - `npm ci`
          - `npm run typecheck`
          - `npm test`
          - `npm run lint`
          - `npm run build`
          - verificação de que `supabase/migrations/` contém exatamente as 21 versões registradas no Supabase remoto de homologação em 2026-08-07.

          Nenhuma alteração foi feita no banco Supabase por este workflow.
          EOF
          git add -A docs/LOTE0-VERIFIED.md docs/LOTE0-CI-FAILURE.md 2>/dev/null || true
          git commit -m "test: record successful Lote 0 verification"
          git push origin HEAD:chore/reconcile-supabase-migrations-2026-08-07

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '# Lote 0 — diagnóstico de falha'
            echo
            echo 'A validação automatizada da reconciliação de migrations falhou.'
            echo
            for file in /tmp/lote0-install.log /tmp/lote0-typecheck.log /tmp/lote0-tests.log /tmp/lote0-lint.log /tmp/lote0-build.log /tmp/lote0-lineage.log; do
              if [ -f "$file" ]; then
                echo "## $(basename "$file")"
                echo '```text'
                tail -n 160 "$file"
                echo '```'
                echo
              fi
            done
          } > docs/LOTE0-CI-FAILURE.md
          git add docs/LOTE0-CI-FAILURE.md
          git commit -m "test: record Lote 0 verification failure" || true
          git push origin HEAD:chore/reconcile-supabase-migrations-2026-08-07 || true
