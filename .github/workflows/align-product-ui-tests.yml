name: Align product UI tests

on:
  push:
    branches:
      - feat/product-ui-and-complete-reports-2026-08-07

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/product-ui-and-complete-reports-2026-08-07
      - name: Align source assertions with the new shared product shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/rendered-html.test.mjs')
          text = path.read_text()

          text = re.sub(
            r'test\("keeps the administrative navigation centered on every menu page", async \(\) => \{[\s\S]*?\n\}\);\n\n',
            '''test("uses the shared premium administrative navigation on management pages", async () => {
  const [agendaPage, clientPage, reportsPage, panelShell] = await Promise.all([
    readFile(new URL("../app/painel/agenda/page.tsx", import.meta.url), "utf8"),
    readFile(new URL("../app/painel/clientes/page.tsx", import.meta.url), "utf8"),
    readFile(new URL("../app/painel/relatorios/page.tsx", import.meta.url), "utf8"),
    readFile(new URL("../app/painel/PanelShell.tsx", import.meta.url), "utf8"),
  ]);

  assert.match(agendaPage, /PanelShell/);
  assert.match(clientPage, /PanelShell/);
  assert.match(reportsPage, /PanelShell/);
  assert.match(panelShell, /className="product-nav"/);
  assert.match(panelShell, /Navegação do painel/);
});

''',
            text,
            count=1,
          )

          replacements = {
            'assert.match(clientPage, /Falar no WhatsApp/);': 'assert.match(clientPage, /WhatsApp/);',
            'assert.match(panelPage, /Dados cadastrais/);': 'assert.match(panelPage, /Configurações/);',
            'assert.match(panelPage, /Página pública da barbearia/);': 'assert.match(panelPage, /Página pública/);',
            'assert.match(panelPage, /href="\\/painel"/);': 'assert.match(panelPage, /PanelShell/);',
            'assert.match(agendaPage, /href="\\/painel"/);': 'assert.match(agendaPage, /PanelShell/);',
            'assert.match(clientPage, /href="\\/painel"/);': 'assert.match(clientPage, /PanelShell/);',
            'assert.match(clientPage, /justifyContent: "center"/);': 'assert.match(clientPage, /PanelShell/);',
            'assert.match(agendaPage, /justifyContent: "center"/);': 'assert.match(agendaPage, /PanelShell/);',
            'assert.match(panelPage, /justifyContent: "center"/);': 'assert.match(panelPage, /PanelShell/);',
            'assert.match(professionalsPage, /Link href="\\/painel"/);': 'assert.match(professionalsPage, /PanelShell/);',
          }
          for old, new in replacements.items():
            text = text.replace(old, new)

          text = re.sub(
            r'test\("limits Meus agendamentos to the authenticated customer", async \(\) => \{[\s\S]*?\n\}\);\n\n',
            '''test("limits Meus agendamentos to the authenticated customer and uses customer login", async () => {
  const customerBookingsPage = await readFile(new URL("../app/meus-agendamentos/page.tsx", import.meta.url), "utf8");

  assert.match(customerBookingsPage, /supabase\.auth\.getUser\(\)/);
  assert.match(customerBookingsPage, /\/cliente\/entrar\?returnTo=%2Fmeus-agendamentos/);
  assert.match(customerBookingsPage, /from\("customers"\)[\s\S]*?eq\("auth_user_id", user\.id\)/);
  assert.match(customerBookingsPage, /from\("appointments"\)[\s\S]*?eq\("customer_id", user\.id\)[\s\S]*?order\("starts_at", \{ ascending: false \}\)/);
  assert.match(customerBookingsPage, /Você não tem agendamentos futuros/);
  assert.match(customerBookingsPage, /rpc\("save_my_customer_profile"/);
});

''',
            text,
            count=1,
          )

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs
          git commit -m "test: align legacy UI assertions with product redesign"
          git push origin HEAD:feat/product-ui-and-complete-reports-2026-08-07
