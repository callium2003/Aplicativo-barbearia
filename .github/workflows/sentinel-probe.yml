name: Sentinel Probe

on:
  schedule:
    # Sondagem periódica a cada 15 minutos sem serviços pagos externos
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Autonomous Service Probing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run Sentinel Health Probes
        run: npm run sentinel:probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://barbeariasp.cullentech.com.br
